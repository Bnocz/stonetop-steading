name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t stonetop-steading .
      - name: Smoke test the image
        shell: bash
        run: |
          docker run -d --name app -p 8080:8080 stonetop-steading
          # Docker's port proxy resets connections until the app is listening,
          # so retry on every error, not just connection refused.
          health=$(curl -fsS --retry 15 --retry-all-errors --retry-delay 1 http://localhost:8080/health)
          echo "$health"
          grep -q '"status":"ok"' <<< "$health"
          index=$(curl -fsS http://localhost:8080/)
          grep -q '<div id="root">' <<< "$index"
      - if: failure()
        run: docker logs app

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
